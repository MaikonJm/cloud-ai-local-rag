services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "2m"
    volumes:
      - ./storage/ollama:/root/.ollama
    networks: [internal]
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - ./storage/qdrant:/qdrant/storage
    networks: [internal]
  knowledge-api:
    build: ./services/knowledge-api
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      API_TOKEN: ${API_TOKEN}
      CLASSIFIER_MODEL: qwen2.5:3b
      EMBED_MODEL: nomic-embed-text
    volumes:
      - ./knowledge:/data/knowledge
      - ./storage/metadata:/data/metadata
    ports:
      - '127.0.0.1:8000:8000'
    depends_on: [ollama, qdrant]
    networks: [internal]
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: 'true'
    volumes:
      - ./storage/open-webui:/app/backend/data
    ports:
      - '127.0.0.1:3000:8080'
    depends_on: [ollama]
    networks: [internal]
networks:
  internal:
    driver: bridge
